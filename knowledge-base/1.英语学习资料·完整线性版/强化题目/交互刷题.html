<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>英语学习资料·完整线性版｜交互刷题中心</title>
<style>
  :root {
    --bg: #f6f5f0;
    --surface: #ffffff;
    --surface-soft: #faf9f5;
    --border: #e6e3da;
    --border-strong: #d4cfc2;
    --text: #22242a;
    --text-muted: #666a73;
    --accent: #2c6bed;
    --accent-soft: #eaf1ff;
    --ok: #1d8a4e;
    --ok-soft: #e8f7ee;
    --warn: #b86e00;
    --warn-soft: #fff5e0;
    --bad: #c93434;
    --bad-soft: #fdecec;
    --code-bg: #f0eee7;
    --shadow: 0 2px 10px rgba(25, 28, 36, 0.05);
    --radius: 12px;
  }
  [data-theme="dark"] {
    --bg: #14171d;
    --surface: #1d212a;
    --surface-soft: #232834;
    --border: #2e3442;
    --border-strong: #3f4759;
    --text: #e7eaf0;
    --text-muted: #9aa2b2;
    --accent: #6aa0ff;
    --accent-soft: #1e2c47;
    --ok: #4cd084;
    --ok-soft: #173324;
    --warn: #f2b44c;
    --warn-soft: #362a16;
    --bad: #f26d6d;
    --bad-soft: #3a1d21;
    --code-bg: #29303e;
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.28);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: grid;
    grid-template-columns: 290px 1fr;
    min-height: 100vh;
  }
  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 18px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-size: 16px; font-weight: 700; margin: 0 0 4px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 10px; }
  .search-input {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-soft);
    color: var(--text); font-size: 13px; outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .sidebar-tools {
    display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  .tool-btn {
    flex: 1; padding: 7px 8px; font-size: 12px; font-weight: 600;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-soft); color: var(--text); cursor: pointer;
    transition: all .15s;
  }
  .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tool-btn.active { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .chapter-list {
    flex: 1; overflow-y: auto; padding: 8px 10px 24px;
  }
  .stage-label {
    font-size: 11px; font-weight: 700; color: var(--text-muted);
    padding: 12px 8px 4px; letter-spacing: .3px;
  }
  .ch-item {
    display: flex; flex-direction: column; gap: 4px;
    padding: 8px 10px; margin-bottom: 3px; border-radius: 9px;
    cursor: pointer; border: 1px solid transparent;
    transition: background .15s, border-color .15s;
  }
  .ch-item:hover { background: var(--surface-soft); }
  .ch-item.active { background: var(--accent-soft); border-color: var(--accent); }
  .ch-item-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .ch-code {
    font-size: 11px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); padding: 1px 6px; border-radius: 5px;
    flex-shrink: 0;
  }
  .ch-item.active .ch-code { background: var(--accent); color: #fff; }
  .ch-name {
    font-size: 13px; font-weight: 500; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ch-stat { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
  .mini-bar { height: 3px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .mini-bar-fill { height: 100%; background: var(--ok); transition: width .25s; }

  /* Main */
  .main {
    padding: 24px 32px 64px;
    max-width: 960px;
    width: 100%;
    margin: 0 auto;
  }
  .mobile-bar {
    display: none; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 20;
  }
  .header-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .header-top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .ch-title { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .ch-scope { font-size: 13.5px; color: var(--text-muted); margin: 0; }
  .summary-pills {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px;
  }
  .stat-pill {
    font-size: 12.5px; padding: 4px 10px; border-radius: 99px;
    background: var(--surface-soft); border: 1px solid var(--border); color: var(--text);
  }
  .stat-pill.pass { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .stat-pill.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 600; }

  details.drawer {
    margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 10px;
  }
  details.drawer summary {
    cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent); user-select: none;
  }
  .cov-table {
    width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px;
  }
  .cov-table th, .cov-table td {
    text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border);
  }
  .cov-table th { color: var(--text-muted); font-weight: 600; background: var(--surface-soft); }

  /* Controls */
  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex; flex-direction: column; gap: 10px;
    position: sticky; top: 10px; z-index: 10;
    box-shadow: var(--shadow);
  }
  .ctrl-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
  .pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 500;
    border: 1px solid var(--border); background: var(--surface-soft); color: var(--text);
    cursor: pointer; transition: all .15s;
  }
  .pill:hover { border-color: var(--accent); }
  .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .ghost-btn {
    padding: 5px 10px; border-radius: 8px; font-size: 12.5px;
    border: 1px solid var(--border); background: transparent; color: var(--text-muted);
    cursor: pointer; transition: all .15s;
  }
  .ghost-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-soft); }

  /* Question Cards */
  .q-list { display: flex; flex-direction: column; gap: 12px; }
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow);
    transition: border-color .15s;
  }
  .q-card.st-ok { border-left-color: var(--ok); }
  .q-card.st-warn { border-left-color: var(--warn); }
  .q-card.st-bad { border-left-color: var(--bad); }

  .q-meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;
  }
  .q-id { font-weight: 700; font-size: 14px; color: var(--accent); }
  .q-tag {
    font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
  }
  .q-tag.req { background: var(--accent-soft); color: var(--accent); }
  .q-tag.read { background: var(--warn-soft); color: var(--warn); }
  .q-tag.opt { background: var(--surface-soft); color: var(--text-muted); border: 1px solid var(--border); }
  .q-topic { font-size: 12.5px; color: var(--text-muted); }
  .q-chapter-badge {
    font-size: 11.5px; padding: 2px 8px; border-radius: 6px;
    background: var(--code-bg); color: var(--text-muted); margin-left: auto;
  }

  .q-prompt { font-size: 15.5px; margin: 0 0 12px; line-height: 1.75; }
  .q-prompt code, .ans-body code {
    background: var(--code-bg); padding: 2px 6px; border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.92em;
  }
  .blank-slot {
    display: inline-block; padding: 0 6px; border-bottom: 2px solid var(--accent);
    color: var(--accent); font-weight: 600; margin: 0 2px;
  }
  .ref-chip {
    font-size: 12px; padding: 1px 7px; border-radius: 5px;
    background: var(--surface-soft); border: 1px solid var(--border); color: var(--text-muted);
  }

  .q-input-row { margin-bottom: 12px; }
  .q-input {
    width: 100%; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-soft);
    color: var(--text); font-size: 14px; outline: none;
    transition: border-color .15s, background .15s;
  }
  .q-input:focus { border-color: var(--accent); background: var(--surface); }

  .q-actions {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .ans-toggle {
    padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent);
    cursor: pointer; transition: all .15s;
  }
  .ans-toggle:hover { background: var(--accent); color: #fff; }
  .ans-toggle.open { background: var(--surface-soft); border-color: var(--border-strong); color: var(--text-muted); }

  .grade-group { display: flex; gap: 6px; }
  .grade-btn {
    padding: 6px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 500;
    border: 1px solid var(--border); background: var(--surface-soft); color: var(--text-muted);
    cursor: pointer; transition: all .15s;
  }
  .grade-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .grade-btn.active-ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .grade-btn.active-warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 700; }
  .grade-btn.active-bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 700; }

  .ans-box {
    display: none;
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 9px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
  }
  .ans-box.show { display: block; animation: fadeIn .15s ease-out; }
  .ans-label { font-size: 11.5px; font-weight: 700; color: var(--ok); margin-bottom: 4px; letter-spacing: .3px; }
  .ans-body { font-size: 14.5px; line-height: 1.7; }

  .empty-state {
    text-align: center; padding: 48px 20px; color: var(--text-muted);
    background: var(--surface); border: 1px dashed var(--border-strong); border-radius: var(--radius);
  }

  .bottom-nav {
    display: flex; justify-content: space-between; margin-top: 24px; gap: 12px;
  }
  .nav-btn {
    padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    cursor: pointer; transition: all .15s;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .nav-btn:disabled { opacity: .4; cursor: not-allowed; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .mobile-bar { display: flex; }
    .sidebar {
      position: fixed; left: -310px; top: 0; width: 290px; z-index: 40;
      transition: left .2s ease; box-shadow: 4px 0 24px rgba(0,0,0,.2);
    }
    .sidebar.open { left: 0; }
    .main { padding: 16px 14px 48px; }
    .controls { position: static; }
  }
</style>
</head>
<body>
<div class="mobile-bar">
  <button class="ghost-btn" id="menuBtn">☰ 章节目录</button>
  <strong style="font-size:14px;">英语交互刷题中心</strong>
  <button class="ghost-btn" id="themeBtnMobile">🌓</button>
</div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span>📘 英语交互刷题中心</span>
        <button class="ghost-btn" id="themeBtn" title="切换深浅色">🌓</button>
      </div>
      <p class="brand-sub">31 章强化与验收 · 离线自动存进度</p>
      <input class="search-input" id="chSearch" type="text" placeholder="搜索章节号或关键词…" />
    </div>
    <div class="sidebar-tools">
      <button class="tool-btn" id="wrongBookBtn">📕 全局错题本 (<span id="wrongCount">0</span>)</button>
    </div>
    <div class="chapter-list" id="chapterList"></div>
  </aside>

  <main class="main">
    <div id="headerArea"></div>
    <div id="controlsArea"></div>
    <div class="q-list" id="questionList"></div>
    <div class="bottom-nav" id="bottomNav"></div>
  </main>
</div>

，我们仍出去了。 可用词语（次序打乱，不要求全部唯一用法）：Although / it / out / rained / we / went。", "answer": "参考：Although it rained, we went out.；本题常见结构不重复but。 意思、指定结构相同的其他正确表达也可。"}, {"id": "A23", "group": "A", "tag": "必做", "required": true, "topic": "目的", "prompt": "独立表达：我学习以便能读英语。 可用词语（次序打乱，不要求全部唯一用法）：can / English / I / read / so / study / that。", "answer": "参考：I study so that I can read English.；so that引出目的从句。 意思、指定结构相同的其他正确表达也可。"}, {"id": "A24", "group": "A", "tag": "必做", "required": true, "topic": "结果", "prompt": "独立表达：他太累了，所以睡了。 可用词语（次序打乱，不要求全部唯一用法）：He / he / slept / so / that / tired / was。", "answer": "参考：He was so tired that he slept.；指定结果结构so ... that。 意思、指定结构相同的其他正确表达也可。"}, {"id": "B01", "group": "B", "tag": "必做", "required": true, "topic": "时态串联", "prompt": "While I was reading, the phone rang中背景和事件各是什么？（串联第14章；需要回看时可点 <span class=\"ref-chip\">对应已学章节</span>）", "answer": "was reading是进行背景，rang是电话响的事件；while从句表时间。"}, {"id": "B02", "group": "B", "tag": "必做", "required": true, "topic": "形容词串联", "prompt": "补全：It is <span class=\"blank-slot\">_____</span> a useful book that I read it twice.（such/so）（串联第06章；需要回看时可点 <span class=\"ref-chip\">对应已学章节</span>）", "answer": "such；本题名词短语a useful book前用such。"}, {"id": "B03", "group": "B", "tag": "必做", "required": true, "topic": "情态串联", "prompt": "If you need help, you <span class=\"blank-slot\">_____</span> ask me.（表示可以，can）（串联第16章；需要回看时可点 <span class=\"ref-chip\">对应已学章节</span>）", "answer": "can；主句不只有will一种选择。"}, {"id": "B04", "group": "B", "tag": "必做", "required": true, "topic": "连词串联", "prompt": "把Because it rained, so I stayed home按中性标准结构改正。（串联第19章；需要回看时可点 <span class=\"ref-chip\">对应已学章节</span>）", "answer": "去so或改为It rained, so I stayed home。"}, {"id": "D01", "group": "D", "tag": "必做", "required": true, "topic": "无论", "prompt": "翻译：Whether it is hot or cold, I will go out.（hot＝热的；cold＝冷的）", "answer": "无论天气热还是冷，我都会出去。两种情况都不改变主句结论。"}, {"id": "D02", "group": "D", "tag": "必做", "required": true, "topic": "两种情况", "prompt": "按“无论下不下雨”补全：Whether it rains <span class=\"blank-slot\">_____</span>, we will go out.", "answer": "or not；补出不下雨这一种情况，不是说要先确定是否下雨。"}, {"id": "D03", "group": "D", "tag": "必做", "required": true, "topic": "重复内容", "prompt": "Whether you are at home or at school中的or后没有再写you are，完整说法是什么？", "answer": "Whether you are at home or you are at school；相同内容没有重复，不改变“无论”的意思。"}, {"id": "D04", "group": "D", "tag": "必做", "required": true, "topic": "unless否定", "prompt": "Unless you hurry, you will be late中，若无故把hurry改成do not hurry，意思还一样吗？", "answer": "不一样。原句是“除非赶快，否则迟到”；加not会把例外条件变成“不赶快”，不能重复添加否定。"}, {"id": "D05", "group": "D", "tag": "必做", "required": true, "topic": "not的真实含义", "prompt": "We will go out unless you are not ready.中的not是否必须删掉？（ready＝准备好的；原意为除非你还没准备好）", "answer": "不必删；not ready正是原意所需的否定条件。unless后并非在所有语境都禁止not。"}, {"id": "D06", "group": "D", "tag": "必做", "required": true, "topic": "独立表达", "prompt": "用whether ... or not写“无论天气冷不冷，我都会读书”，提供it／is／cold／I／will／read。", "answer": "Whether it is cold or not, I will read.；两种天气情况下都会读书。"}, {"id": "C01", "group": "C", "tag": "必做", "required": true, "topic": "时间", "prompt": "before和after表达的时间顺序相同吗？", "answer": "不同；before表示在……之前，after表示在……之后。"}, {"id": "C02", "group": "C", "tag": "必做", "required": true, "topic": "条件", "prompt": "unless在本章常见语境中可用哪个if结构解释？", "answer": "if ... not；如Unless you hurry可对应If you don't hurry。"}, {"id": "C03", "group": "C", "tag": "必做", "required": true, "topic": "让步", "prompt": "Even though I was tired, I helped her中哪个意思是“即使/尽管”？", "answer": "even though，引出让步。"}, {"id": "C04", "group": "C", "tag": "必做", "required": true, "topic": "地点", "prompt": "Where there is water, there is life中where从句表达什么？", "answer": "地点/范围背景，意为有水的地方。"}, {"id": "C05", "group": "C", "tag": "必做", "required": true, "topic": "方式", "prompt": "Do as I do中的as从句说明什么？", "answer": "方式，意为照我做的方式做。"}, {"id": "C06", "group": "C", "tag": "必做", "required": true, "topic": "比较", "prompt": "He runs faster than I do中than后部分与什么结构相关？", "answer": "比较结构；do代替前面已知的run，避免重复。"}, {"id": "C07", ag": "必做", "required": true, "topic": "即将", "prompt": "be about to通常适合与一个很远的将来日期机械搭配吗？", "answer": "不适合；它通常表示即将发生，不与任意遥远计划时间等同。"}, {"id": "C05", "group": "C", "tag": "必做", "required": true, "topic": "三大从句", "prompt": "I know where she works中的从句是宾语还是地点状语？", "answer": "宾语从句；整体是知道的内容，不因where就一定是地点状语从句。"}, {"id": "C06", "group": "C", "tag": "必做", "required": true, "topic": "从句语序", "prompt": "改正：Do you know where does Amy work?", "answer": "Do you know where Amy works?"}, {"id": "C07", "group": "C", "tag": "必做", "required": true, "topic": "现在完成", "prompt": "I have lived here since 2020中的since表示起点还是时长？", "answer": "起点；这里从2020年持续到现在。"}, {"id": "C08", "group": "C", "tag": "必做", "required": true, "topic": "瞬间延续", "prompt": "I have bought this car for two years想表达持续拥有两年，本章建议如何改？", "answer": "I have had this car for two years.；区分购买事件与持续拥有状态。"}, {"id": "C09", "group": "C", "tag": "必做", "required": true, "topic": "过去完成", "prompt": "The train had left when I arrived，arrived是哪个参照点？", "answer": "过去到达的时点；离开在它之前。"}, {"id": "C10", "group": "C", "tag": "必做", "required": true, "topic": "进行完成", "prompt": "has been reading与has read the whole book重心相同吗？", "answer": "不同；前者突出持续阅读活动，后者可突出读完整本书的结果。"}, {"id": "C11", "group": "C", "tag": "必做", "required": true, "topic": "转述祈使", "prompt": "把Amy said to me, Please wait改为tell类间接表达。", "answer": "Amy told me to wait.；转述请求/指令采用对应结构。"}, {"id": "C12", "group": "C", "tag": "必做", "required": true, "topic": "开放", "prompt": "用said、would、the next day写一句过去计划的转述，并解释先后。", "answer": "示例：Tom said he would study the next day.；说发生在过去，学习相对说的时点在之后。"}]}, {"num": 24, "code": "24", "title": "代词进阶：不定、替代、it 与关系词", "stage": "第三阶段：从简单句走向复杂句", "scope": "重点是代词、替代、数量、关系词和本章形式it；含to结构只辨本章已给的功能，不展开第26章难点。", "cFull": 24, "cPass": 20, "coverage": [{"scene": "不定代词一致", "point": "everyone按本章单数一致。", "ids": "A01、A09、A17"}, {"scene": "可数数量", "point": "a few修饰可数复数。", "ids": "A02、A10、A18"}, {"scene": "不可数数量", "point": "a little修饰不可数milk。", "ids": "A03、A11、A19"}, {"scene": "替代词", "point": "one替代同类单数物，不指原支坏笔。", "ids": "A04、A12、A20"}, {"scene": "比较替代", "point": "hers替代她的书，保持比较对象一致。", "ids": "A05、A13、A21"}, {"scene": "否定代词", "point": "neither本身带否定，不另叠doesn't。", "ids": "A06、A14、A22"}, {"scene": "形式主语", "point": "这里it占形式主语位置，to read提供内容。", "ids": "A07、A15、A23"}, {"scene": "关系词", "point": "who已作从句主语，不再加she。", "ids": "A08、A16、A24"}], "groups": [{"key": "A", "label": "A 分项强化", "count": 24}, {"key": "B", "label": "B 串联应用", "count": 4}, {"key": "C", "label": "C 独立验收", "count": 12}], "questions": [{"id": "A01", "group": "A", "tag": "必做", "required": true, "topic": "不定代词一致", "prompt": "按提示补全或完成（写完整句子或短语）：Everyone <span class=\"blank-slot\">_____</span> here.", "answer": "Everyone is here.；everyone按本章单数一致。"}, {"id": "A02", "group": "A", "tag": "必做", "required": true, "topic": "可数数量", "prompt": "按提示补全或完成（写完整句子或短语）：I have <span class=\"blank-slot\">_____</span> books.（一些，用a few）", "answer": "I have a few books.；a few修饰可数复数。"}, {"id": "A03", "group": "A", "tag": "必做", "required": true, "topic": "不可数数量", "prompt": "按提示补全或完成（写完整句子或短语）：There is <span class=\"blank-slot\">_____</span> milk.（一点，用a little）", "answer": "There is a little milk.；a little修饰不可数milk。"}, {"id": "A04", "group": "A", "tag": "必做", "required": true, "topic": "替代词", "prompt": "按提示补全或完成（写完整句子或短语）：This pen is broken. I need a new <span class=\"blank-slot\">_____</span>.", "answer": "This pen is broken. I need a new one.；one替代同类单数物，不指原支坏笔。"}, {"id": "A05", "group": "A", "tag": "必做", "required": true, "topic": "比较替代", "prompt": "按提示补全或完成（写完整句子或短语）：My books are newer than <span class=\"blank-slot\">_____</span>.（她的）", "answer": "My books are newer than hers.；hers替代她的书，保持比较对象一致。"}, {"id": "A06", "group": "A", "tag": "必做", "required": true, "topic": "否定代词", "prompt": "按提示补全或完成（写完整句子或短语）：She likes <span class=\"blank-slot\">_____</span> of them.（两者都不，用neither）", "answer": "She likes neither of them.；neither本身带否定，不另叠doesn't。"}, {"id": "A07", "group": "A", "tag": "必做", "required": true, "topic": "形式主语", "prompt": "按提示补全或完成（写完整句子或短语）：<span class=\"blank-slot\">_____</span> is useful to read.", "answer": "It is useful to read.；这里it占形式主语位置，to read提供内容。"}, {"id": "A08", "group": "A", "tag": "必做", "required": true, "topic": "关系词", "prompt": "按提示补全或完成（写完整句子或短语）：The girl <span class=\"blank-slot\">_____</span> works here is Amy.（who）", "answer": "The girl who works here is Amy.；who已作从句主语，不再加she。"}, {"id": "A09", "group": "A", "tag": "选做", "required": false, "topic": "不定代词一致", "prompt": "目标意思：每个人都在这里。 请修正不合形式或不合题意的表达：<code>Everyone are here.</code>。", "answer": "Everyone is here.；everyone按本章单数一致。 这项修正以题意为准，不把所有其他语境也一概判错。"}, {"id": "A10", "group": "A", "tag": "选做", "required": false, "topic": "可数数量", "prompt": "目标意思：我有几本书。 请修正不合形式或不合题意的表达：<code>I have a little books.</code>。", "answer": "I have a few books.；a few修饰可数复数。 这项修正以题意为准，不把所有其他语境也一概判错。"}, {"id": "A11", "group": "A", "tag": "选做", "required": false, "topic": "不可数数量", "prompt": "目标意思：有一点牛奶。 请修正不合形式或不合题意的表达：<code>There is a few milk.</code>。", "answer": "There is a little milk.；a little修饰不可数milk。 这项修正以题意为准，不把所有其他语境也一概判错。"}, {"id": "A12", "group": "A", "tag": "选做", "required": false, "topic": "替代词", "prompt": "目标意思：这支笔坏了，我需要另一支新的。 请修正不合形式或不合题意的表达：<code>This pen is broken. I need a new it.</code>。", "answer": "This pen is broken. I need a new one.；one替代同类单数物，不指原支坏笔。 这项修正以题意为准，不把所有其他语境也一概判错。"}, {"id": "A13", "group": "A", "tag": "选做", "required": false, "topic": "比较替代", "prompt": "目标意思：我的书比她的更新。 请修正不合形式或不合题意的表达：<code>My books are newer than her.</code>。", "answer": "My books are newer than hers.；hers替代她的书，保持比较对象一致。 这项修正以题意为准，不把所有其他语境也一概判错。"}, {"id": "A14", "group": "A", "tag": "选做", "required": false, "topic": "否定代词", "prompt": "目标意思：两者她都不喜欢，按本章标准否定结构。 请修正不合形式或不合题意的表达：<code>She doesn&#x27;t like neither of them.</code>。", "answer": "She likes neither of them.；neither本身带否定，不另叠doesn't。 这项修正以题意为准，不把所有其他语境也一概判错。"}, {"id": "A15", "group": "A", "tag": "选做", "required": false, "topic": "形式主语", "prompt": "目标意思：阅读是有用的。 请修正不合形式或不合题意的表达：< r与we是同一个逻辑主语吗？（本章应用；需要回看时可点 <span class=\"ref-chip\">对应已学章节</span>）", "answer": "不是；独立主格带自己的主体weather。"}, {"id": "D01", "group": "D", "tag": "必做", "required": true, "topic": "被动动名词", "prompt": "She likes being invited.是否表示说话时她正在被邀请？（invite＝邀请）", "answer": "不一定；being invited整体作likes的宾语，说她喜欢受到邀请这类经历，不自带正在的含义。"}, {"id": "D02", "group": "D", "tag": "必做", "required": true, "topic": "形式与时间", "prompt": "to do、to be doing、to have done是否是每个动作依次必须经历的三步？", "answer": "不是；这是形式对照，分别表达一般、进行、完成等观察方式；须按句中用途和相对时间选用。"}, {"id": "D03", "group": "D", "tag": "必做", "required": true, "topic": "介词必要性", "prompt": "a book to read与a house to live in为什么只有后者有in？", "answer": "read可直接以book作对象；live不直接接house，居住与房子的地点关系需in表达，不能见不定式定语就一律加介词。"}, {"id": "D04", "group": "D", "tag": "必做", "required": true, "topic": "标注纠错", "prompt": "Reading aloud helps you remember words.中是否实际出现了to remember？（aloud＝大声地）", "answer": "没有；remember是不带to的不定式，help sb do是本章已给搭配；不能在原句标注中凭空补出to。"}, {"id": "D05", "group": "D", "tag": "必做", "required": true, "topic": "搭配分类", "prompt": "enjoy listening与be afraid of making中，enjoy和of都是介词吗？", "answer": "不是；enjoy是动词，listening作其宾语；of是介词，making位于介词后，两者用-ing的结构理由不同。"}, {"id": "D06", "group": "D", "tag": "必做", "required": true, "topic": "被动转换边界", "prompt": "see／make的常见被动会带to，是否所有let／have＋宾语＋原形都能机械变成be let／be had＋to do？", "answer": "不能统一套用；表示允许的let通常换成be allowed to do；have sb do不机械变成be had to do。"}, {"id": "C01", "group": "C", "tag": "必做", "required": true, "topic": "悬垂修饰", "prompt": "Seeing the dog, I stopped中的seeing主体是谁？", "answer": "I；普通此类分词状语的主体应能从主句合理对应。"}, {"id": "C02", "group": "C", "tag": "必做", "required": true, "topic": "悬垂纠错", "prompt": "想说“我走着，看见一辆公交”：Walking home, a bus was seen by me应如何清楚改写？", "answer": "Walking home, I saw a bus.；让走路的人I作主句主语。"}, {"id": "C03", "group": "C", "tag": "必做", "required": true, "topic": "主动被动", "prompt": "having done与having been done可以无条件互换吗？", "answer": "不能；前者主动，后者被动。"}, {"id": "C04", "group": "C", "tag": "必做", "required": true, "topic": "不定式被动", "promp ired": true, "topic": "所属撇号", "prompt": "独立表达：汤姆的书。 可用词语（次序打乱，不要求全部唯一用法）：book / Tom&#x27;s。", "answer": "参考：Tom's book；所属撇号有结构作用，不是普通装饰。 意思、指定结构相同的其他正确表达也可。"}, {"id": "A22", "group": "A", "tag": "必做", "required": true, "topic": "缩写", "prompt": "独立表达：正在下雨。 可用词语（次序打乱，不要求全部唯一用法）：It&#x27;s / raining。", "answer": "参考：It's raining.；it's等于it is，its表所属。 意思、指定结构相同的其他正确表达也可。"}, {"id": "A23", "group": "A", "tag": "必做", "required": true, "topic": "句中副词", "prompt": "独立表达：不过，他累了，要求副词作句中插入。 可用词语（次序打乱，不要求全部唯一用法）：He / however / tired / was。", "answer": "参考：He was, however, tired.；不是每个however紧前都必须有句号或分号。 意思、指定结构相同的其他正确表达也可。"}, {"id": "A24", "group": "A", "tag": "选做", "required": false, "topic": "直接引语", "prompt": "独立表达：“我累了，”她说，要求同一陈述引语后接引述语。 可用词语（次序打乱，不要求全部唯一用法）：am / I / said / she / tired。", "answer": "参考：\"I am tired,\" she said.；陈述引语与后接引述语在此用逗号衔接。 意思、指定结构相同的其他正确表达也可。"}, {"id": "B01", "group": "B", "tag": "必做", "required": true, "topic": "从句串联", "prompt": "Although I was tired, I helped her中的逗号连接的是两个独立句吗？（串联第20章；需要回看时可点 <span class=\"ref-chip\">对应已学章节</span>）", "answer": "不是；前面为依附的让步从句，后面主句，不能把它误判成普通逗号拼接。"}, {"id": "B02", "group": "B", "tag": "必做", "required": true, "topic": "所有格复习", "prompt": "写“老师们的办公室”，teacher复数，office办公室。（串联第05章；需要回看时可点 <span class=\"ref-chip\">对应已学章节</span>）", "answer": "the teachers' office；s后撇号。"}, {"id": "B03", "group": "B", "tag": "必做", "required": true, "topic": "关系从句复习", "prompt": "Amy, who lives here, is kind中的逗号有什么作用？（串联第22章；需要回看时可点 <span class=\"ref-chip\">对应已学章节</span>）", "answer": "标记补充性非限制性关系从句，非普通两独立句硬接。"}, {"id": "B04", "group": "B", "tag": "必做", "required": true, "topic": "多句逻辑", "prompt": "把I was tired. I rested.用一个因果连接改写，不改变意思。（串联第19章；需要回看时可点 <span class=\"ref-chip\">对应已学章节</span>）", "answer": "I was tired, so I rested.或Because I was tired, I rested。"}, {"id": "C01", "group": "C", "tag": "必做", "required": true, "topic": "however位置", "prompt": "however只能放在句首吗？给出句中位置的例子。", "answer": "不是；He was, however, tired.可成立。"}, {"id": "C02", "group": "C", const STORAGE_KEY = "eng_linear_practice_v1";
const THEME_KEY = "eng_linear_theme_v1";

let state = loadState();
let viewMode = "chapter"; // "chapter" | "wrongbook"
let currentCh = 1;
let filterMode = "required"; // "required" | "all" | "todo" | "review"
let groupTab = "ALL"; // "ALL" | "A" | "B" | "D" | "C"
let openAnswers = new Set();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { grades: {}, inputs: {} };
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
function qKey(chCode, qid) { return `${chCode}:${qid}`; }

function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(THEME_KEY, next);
}

function getAllWrongItems() {
  const res = [];
  for (const ch of DATA) {
    for (const q of ch.questions) {
      const g = state.grades[qKey(ch.code, q.id)];
      if (g === "bad" || g === "warn") {
        res.push({ ch, q, grade: g });
      }
    }
  }
  return res;
}

function renderSidebar() {
  const list = document.getElementById("chapterList");
  const kw = document.getElementById("chSearch").value.trim().toLowerCase();
  const wrongItems = getAllWrongItems();
  document.getElementById("wrongCount").textContent = wrongItems.length;
  document.getElementById("wrongBookBtn").classList.toggle("active", viewMode === "wrongbook");

  let html = "";
  let lastStage = "";
  for (const ch of DATA) {
    if (kw && !ch.code.includes(kw) && !ch.title.toLowerCase().includes(kw)) continue;
    if (ch.stage !== lastStage) {
      html += `<div class="stage-label">${ch.stage}</div>`;
      lastStage = ch.stage;
    }
    const reqQs = ch.questions.filter(q => q.required);
    const doneOk = reqQs.filter(q => state.grades[qKey(ch.code, q.id)] === "ok").length;
    const pct = reqQs.length ? Math.round((doneOk / reqQs.length) * 100) : 0;
    const active = viewMode === "chapter" && currentCh === ch.num ? "active" : "";
    html += `
      <div class="ch-item ${active}" data-ch="${ch.num}">
        <div class="ch-item-top">
          <span class="ch-code">${ch.code}</span>
          <span class="ch-name" title="${ch.title}">${ch.title}</span>
          <span class="ch-stat">${doneOk}/${reqQs.length}</span>
        </div>
        <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
  }
  list.innerHTML = html;
  list.querySelectorAll(".ch-item").forEach(el => {
    el.addEventListener("click", () => {
      currentCh = Number(el.dataset.ch);
      viewMode = "chapter";
      groupTab = "ALL";
      openAnswers.clear();
      location.hash = `ch=${String(currentCh).padStart(2, "0")}`;
      document.getElementById("sidebar").classList.remove("open");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
}

function getFilteredQuestions(ch) {
  return ch.questions.filter(q => {
    if (groupTab !== "ALL" && q.group !== groupTab) return false;
    const g = state.grades[qKey(ch.code, q.id)];
    if (filterMode === "required" && !q.required) return false;
    if (filterMode === "todo" && g) return false;
    if (filterMode === "review" && g !== "bad" && g !== "warn") return false;
    return true;
  });
}

function renderCard(ch, q, showChapterBadge = false) {
  const key = qKey(ch.code, q.id);
  const grade = state.grades[key] || "";
  const savedInput = state.inputs[key] || "";
  const isOpen = openAnswers.has(key);
  const tagClass = q.tag === "选做" ? "opt" : (q.tag === "识读必做" ? "read" : "req");
  const cardState = grade ? `st-${grade}` : "";

  return `
    <article class="q-card ${cardState}" data-key="${key}">
      <div class="q-meta">
        <span class="q-id">${q.id}</span>
        <span class="q-tag ${tagClass}">${q.tag}</span>
        <span class="q-topic">${q.topic}</span>
        ${showChapterBadge ? `<span class="q-chapter-badge">第${ch.code}章 · ${ch.title}</span>` : ""}
      </div>
      <div class="q-prompt">${q.prompt}</div>
      <div class="q-input-row">
        <input class="q-input" type="text" data-key="${key}" value="${savedInput.replace(/"/g, "&quot;")}" placeholder="在此输入你的答案（按回车直接查看解析，也可直接心中作答）…" />
      </div>
      <div class="q-actions">
        <button class="ans-toggle ${isOpen ? "open" : ""}" data-toggle="${key}">
          ${isOpen ? "🙈 隐藏答案" : "👁 显示答案"}
        </button>
        <div class="grade-group">
          <button class="grade-btn ${grade === "ok" ? "active-ok" : ""}" data-grade="${key}" data-val="ok">✅ 会了</button>
          <button class="grade-btn ${grade === "warn" ? "active-warn" : ""}" data-grade="${key}" data-val="warn">⚠️ 不稳</button>
          <button class="grade-btn ${grade === "bad" ? "active-bad" : ""}" data-grade="${key}" data-val="bad">❌ 错了</button>
        </div>
      </div>
      <div class="ans-box ${isOpen ? "show" : ""}" id="ans-${key.replace(":", "-")}">
        <div class="ans-label">参考答案与解析</div>
        <div class="ans-body">${q.answer}</div>
      </div>
    </article>`;
}

function renderChapter() {
  const ch = DATA.find(c => c.num === currentCh) || DATA[0];
  const reqQs = ch.questions.filter(q => q.required);
  const doneReq = reqQs.filter(q => state.grades[qKey(ch.code, q.id)]).length;
  const okReq = reqQs.filter(q => state.grades[qKey(ch.code, q.id)] === "ok").length;
  const reviewCount = ch.questions.filter(q => {
    const g = state.grades[qKey(ch.code, q.id)];
    return g === "bad" || g === "warn";
  }).length;

  // C-group auto score (首轮必做 C 组：会了=2分，不稳=1分，错了=0分)
  const cReq = ch.questions.filter(q => q.group === "C" && q.required);
  let cScore = 0, cGraded = 0;
  for (const q of cReq) {
    const g = state.grades[qKey(ch.code, q.id)];
    if (g) {
      cGraded++;
      if (g === "ok") cScore += 2;
      else if (g === "warn") cScore += 1;
    }
  }
  const cMax = cReq.length * 2;
  const cPassed = cGraded === cReq.length && cScore >= ch.cPass;

  const covRows = ch.coverage.map(r => `<tr><td>${r.scene}</td><td>${r.point}</td><td>${r.ids}</td></tr>`).join("");

  document.getElementById("headerArea").innerHTML = `
    <section class="header-card">
      <div class="header-top">
        <div>
          <h1 class="ch-title">第 ${ch.code} 章　${ch.title}</h1>
          <p class="ch-scope">${ch.scope || "按首轮必做题完成练习与独立验收即可进入下一章。"}</p>
        </div>
      </div>
      <div class="summary-pills">
        <span class="stat-pill">首轮必做：${okReq} / ${reqQs.length} 会了（已自评 ${doneReq}）</span>
        <span class="stat-pill ${cPassed ? "pass" : (cGraded > 0 ? "warn" : "")}">
          C组独立验收：${cScore} / ${cMax} 分（建议 ≥ ${ch.cPass} 分${cPassed ? " · 已达标 🎉" : ""}）
        </span>
        <span class="stat-pill">本章错题/不稳：${reviewCount} 题</span>
      </div>
      ${ch.coverage.length ? `
      <details class="drawer">
        <summary>📋 展开本章练习范围与易错点（${ch.coverage.length} 个核心情境）</summary>
        <table class="cov-table">
          <thead><tr><th>核心情境</th><th>主要检查</th><th>关联题号</th></tr></thead>
          <tbody>${covRows}</tbody>
        </table>
      </details>` : ""}
    </section>`;

  const groupButtons = [
    `<button class="pill ${groupTab === "ALL" ? "active" : ""}" data-group="ALL">全部组 (${ch.questions.length})</button>`,
    ...ch.groups.map(g => `<button class="pill ${groupTab === g.key ? "active" : ""}" data-group="${g.key}">${g.label} (${g.count})</button>`)
  ].join("");

  document.getElementById("controlsArea").innerHTML = `
    <section class="controls">
      <div class="ctrl-row">
        <div class="pill-group">
          <button class="pill ${filterMode === "required" ? "active" : ""}" data-filter="required">⭐ 首轮必做</button>
          <button class="pill ${filterMode === "all" ? "active" : ""}" data-filter="all">全部题目</button>
          <button class="pill ${filterMode === "todo" ? "active" : ""}" data-filter="todo">未自评</button>
          <button class="pill ${filterMode === "review" ? "active" : ""}" data-filter="review">错题/不稳 (${reviewCount})</button>
        </div>
        <div class="pill-group">
          <button class="ghost-btn" id="expandAllBtn">全部展开答案</button>
          <button class="ghost-btn" id="collapseAllBtn">全部隐藏答案</button>
          <button class="ghost-btn" id="resetChBtn">重置本章</button>
        </div>
      </div>
      <div class="ctrl-row">
        <div class="pill-group">${groupButtons}</div>
      </div>
    </section>`;

  const filtered = getFilteredQuestions(ch);
  const qList = document.getElementById("questionList");
  if (!filtered.length) {
    qList.innerHTML = `<div class="empty-state">当前筛选条件下没有题目 🎉<br/><span style="font-size:13px;">可以切换“全部题目”或“全部组”查看其他题目。</span></div>`;
  } else {
    qList.innerHTML = filtered.map(q => renderCard(ch, q, false)).join("");
  }

  document.getElementById("bottomNav").innerHTML = `
    <button class="nav-btn" id="prevChBtn" ${ch.num <= 1 ? "disabled" : ""}>← 上一章</button>
    <button class="nav-btn" id="nextChBtn" ${ch.num >= DATA.length ? "disabled" : ""}>下一章 →</button>`;

  bindChapterControls(ch, filtered);
  bindCardEvents();
}

function renderWrongBook() {
  const items = getAllWrongItems();
  document.getElementById("headerArea").innerHTML = `
    <section class="header-card">
      <h1 class="ch-title">📕 全局错题与不稳题本</h1>
      <p class="ch-scope">集中复盘你在全书 31 章中标记为“❌ 错了”或“⚠️ 不稳”的题目；重新做对并点“✅ 会了”后会自动移出。</p>
      <div class="summary-pills">
        <span class="stat-pill warn">待修复题目：${items.length} 题</span>
      </div>
    </section>`;

  document.getElementById("controlsArea").innerHTML = `
    <section class="controls">
      <div class="ctrl-row">
        <span style="font-size:13px;color:var(--text-muted);">提示：每题独立点击“显示答案”核对，做稳后点“✅ 会了”。</span>
        <div class="pill-group">
          <button class="ghost-btn" id="expandAllBtn">全部展开答案</button>
          <button class="ghost-btn" id="collapseAllBtn">全部隐藏答案</button>
        </div>
      </div>
    </section>`;

  const qList = document.getElementById("questionList");
  if (!items.length) {
    qList.innerHTML = `<div class="empty-state">目前没有错题或不稳项，继续保持！ 🎉</div>`;
  } else {
    qList.innerHTML = items.map(it => renderCard(it.ch, it.q, true)).join("");
  }
  document.getElementById("bottomNav").innerHTML = "";

  document.getElementById("expandAllBtn")?.addEventListener("click", () => {
    items.forEach(it => openAnswers.add(qKey(it.ch.code, it.q.id)));
    render();
  });
  document.getElementById("collapseAllBtn")?.addEventListener("click", () => {
    openAnswers.clear();
    render();
  });
  bindCardEvents();
}

function bindChapterControls(ch, filtered) {
  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => {
      filterMode = btn.dataset.filter;
      render();
    });
  });
  document.querySelectorAll("[data-group]").forEach(btn => {
    btn.addEventListener("click", () => {
      groupTab = btn.dataset.group;
      render();
    });
  });
  document.getElementById("expandAllBtn")?.addEventListener("click", () => {
    filtered.forEach(q => openAnswers.add(qKey(ch.code, q.id)));
    render();
  });
  document.getElementById("collapseAllBtn")?.addEventListener("click", () => {
    filtered.forEach(q => openAnswers.delete(qKey(ch.code, q.id)));
    render();
  });
  document.getElementById("resetChBtn")?.addEventListener("click", () => {
    if (!confirm(`确定清空第 ${ch.code} 章的作答输入和自评记录吗？`)) return;
    for (const q of ch.questions) {
      const k = qKey(ch.code, q.id);
      delete state.grades[k];
      delete state.inputs[k];
      openAnswers.delete(k);
    }
    saveState();
    render();
  });
  document.getElementById("prevChBtn")?.addEventListener("click", () => {
    if (currentCh > 1) {
      currentCh--;
      groupTab = "ALL";
      openAnswers.clear();
      location.hash = `ch=${String(currentCh).padStart(2, "0")}`;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });
  document.getElementById("nextChBtn")?.addEventListener("click", () => {
    if (currentCh < DATA.length) {
      currentCh++;
      groupTab = "ALL";
      openAnswers.clear();
      location.hash = `ch=${String(currentCh).padStart(2, "0")}`;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });
}

function bindCardEvents() {
  document.querySelectorAll("[data-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const k = btn.dataset.toggle;
      if (openAnswers.has(k)) openAnswers.delete(k);
      else openAnswers.add(k);
      const box = document.getElementById(`ans-${k.replace(":", "-")}`);
      const nowOpen = openAnswers.has(k);
      box.classList.toggle("show", nowOpen);
      btn.classList.toggle("open", nowOpen);
      btn.textContent = nowOpen ? "🙈 隐藏答案" : "👁 显示答案";
    });
  });

  document.querySelectorAll("[data-grade]").forEach(btn => {
    btn.addEventListener("click", () => {
      const k = btn.dataset.grade;
      const val = btn.dataset.val;
      if (state.grades[k] === val) delete state.grades[k];
      else state.grades[k] = val;
      saveState();
      render();
    });
  });

  document.querySelectorAll(".q-input").forEach(inp => {
    inp.addEventListener("input", () => {
      state.inputs[inp.dataset.key] = inp.value;
      saveState();
    });
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        const btn = document.querySelector(`[data-toggle="${inp.dataset.key}"]`);
        btn?.click();
      }
    });
  });
}

function render() {
  renderSidebar();
  if (viewMode === "wrongbook") renderWrongBook();
  else renderChapter();
}

function parseHash() {
  const m = location.hash.match(/ch=(\d+)/);
  if (m) {
    const n = Number(m[1]);
    if (n >= 1 && n <= DATA.length) {
      currentCh = n;
      viewMode = "chapter";
    }
  }
}

document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.getElementById("themeBtnMobile").addEventListener("click", toggleTheme);
document.getElementById("chSearch").addEventListener("input", renderSidebar);
document.getElementById("wrongBookBtn").addEventListener("click", () => {
  viewMode = viewMode === "wrongbook" ? "chapter" : "wrongbook";
  openAnswers.clear();
  document.getElementById("sidebar").classList.remove("open");
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
document.getElementById("menuBtn").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("open");
});
window.addEventListener("hashchange", () => {
  parseHash();
  render();
});

initTheme();
parseHash();
render();
</script>
</body>
</html>
